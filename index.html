<html lang="en-GB">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Deep Cut: the daily dig. Five prompts, 25 seconds each. The rarer your answer, the deeper you dig.">
<meta name="theme-color" content="#0f1424">
<title>Deep Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: the whole screen is a cross-section of the mine. Night sky above, ground line at 58% of the
   screen on the start page; the camera follows the miner down the shaft and the UI floats in the rock. */
:root {
  color-scheme: dark;
  --sky-top: #0f1424;
  --sky-low: #4b3a4a;
  --fg: #f3e6d3;
  --muted: #bfa88c;
  --lantern: #ffb547;
  --panel: rgba(18, 12, 9, 0.84);
  --line: rgba(243, 230, 211, 0.16);
  --bad: #e2725b;
  --f-display: "Bowlby One SC", "Arial Black", Impact, sans-serif;
  --f-body: "Bricolage Grotesque", system-ui, -apple-system, Segoe UI, sans-serif;
  --f-mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
html, body { height: 100%; overflow: hidden; }
body { background: var(--sky-top); color: var(--fg); font-family: var(--f-body); font-size: 16px; }

/* ---------- the world ---------- */
#world { position: fixed; left: 0; right: 0; top: 0; height: 0; will-change: transform; }
.sky { position: absolute; left: -700px; right: -700px; top: -170vh; height: 170vh; background: linear-gradient(180deg, var(--sky-top) 0 55%, #1d2238 75%, var(--sky-low) 100%); overflow: hidden; }
.star { position: absolute; border-radius: 50%; background: var(--fg); }
.star.tw { animation: twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: 0.2; } }
.moon { position: absolute; right: 12%; bottom: 52vh; width: 46px; height: 46px; border-radius: 50%; box-shadow: -12px 6px 0 0 #efe2c8; transform: rotate(-20deg); }
.hills { position: absolute; left: -700px; right: -700px; top: -70px; width: calc(100% + 1400px); height: 72px; }
.under { position: absolute; left: -700px; right: -700px; top: 0; }
.band { position: absolute; left: 0; right: 0; }
#rulerWrap { position: fixed; left: 0; right: 0; top: 0; height: 0; pointer-events: none; will-change: transform; }
.lbl { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); text-shadow: 0 1px 3px rgba(0,0,0,.8); font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(243, 230, 211, 0.4); }
.darkness { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; background: linear-gradient(180deg, transparent 0, rgba(0,0,0,.25) 30%, rgba(0,0,0,.6) 100%); }
.grass { position: absolute; left: -700px; right: -700px; top: -6px; height: 9px; background: #5d7a35; box-shadow: 0 -2px 0 #73943f inset; }
.shaft { position: absolute; top: -3px; width: 70px; transform: translateX(-50%); height: 0; background: linear-gradient(90deg, #070504, #120d0a 30%, #120d0a 70%, #070504); box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
.headframe { position: absolute; left: calc(50% - 470px); top: -150px; width: 120px; height: 152px; }
.cart { position: absolute; left: calc(50% + 330px); top: -40px; width: 78px; height: 42px; }
.ruler { position: absolute; right: 0; top: 0; width: 56px; padding-right: env(safe-area-inset-right, 0px); }
.tick { position: absolute; right: 8px; height: 1px; width: 8px; background: rgba(243,230,211,.3); }
.tick.big { width: 16px; background: rgba(243,230,211,.55); }
.tick span { position: absolute; right: 20px; top: -7px; font-family: var(--f-mono); font-size: 10px; color: rgba(243,230,211,.55); white-space: nowrap; }
.glow { position: absolute; left: 50%; top: 0; width: 340px; height: 340px; margin-left: -150px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle, rgba(255,214,140,.22), transparent 62%); }
#miner { position: absolute; left: 50%; top: 0; }
.rope { position: absolute; left: calc(50% + 2px); top: -150px; width: 3px; background: repeating-linear-gradient(180deg, #c9b08a 0 5px, #9c845f 5px 10px); }
.deco { position: absolute; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
.deco svg { display: block; width: 100%; height: auto; }
.deco.gem { opacity: .92; }

/* gems: one look per tier (used in the world, the HUD and the panels) */
.gem { aspect-ratio: 1; position: relative; }
.gem::before {
  content: ""; position: absolute; inset: 0;
  clip-path: polygon(50% 0, 100% 36%, 80% 100%, 20% 100%, 0 36%);
  background:
    linear-gradient(115deg, rgba(255,255,255,0.55) 0 18%, transparent 19%),
    linear-gradient(245deg, rgba(0,0,0,0.25) 0 30%, transparent 31%),
    linear-gradient(180deg, var(--g1), var(--g2));
}
.gem.t0::before { clip-path: polygon(12% 30%, 40% 6%, 78% 14%, 98% 46%, 84% 88%, 42% 98%, 6% 74%); background: radial-gradient(circle at 35% 30%, #a59d93, #5d5650 70%); }
.gem.t1 { --g1: #f4f1ec; --g2: #b9b3ab; }
.gem.t2 { --g1: #c79bf2; --g2: #6c33a8; }
.gem.t3 { --g1: #6ff0a8; --g2: #0f7a47; }
.gem.t4 { --g1: #ff7a8a; --g2: #a3122c; }
.gem.t5 { --g1: #ffffff; --g2: #7fd3f0; }
.gem.empty::before { clip-path: polygon(20% 40%, 50% 20%, 80% 45%, 60% 80%, 25% 75%); background: rgba(255,255,255,0.1); }
.struck { position: absolute; width: 34px; transform: translate(-50%, -50%); filter: drop-shadow(0 0 8px rgba(255,230,170,.35)); animation: pop 520ms cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { 0% { transform: translate(-50%,-50%) scale(0) rotate(-30deg); } 100% { transform: translate(-50%,-50%) scale(1); } }
.flash { position: absolute; width: 20px; height: 20px; border-radius: 50%; transform: translate(-50%,-50%); background: radial-gradient(circle, rgba(255,244,210,.95), rgba(255,200,120,0) 70%); animation: flash 600ms ease-out forwards; pointer-events: none; }
@keyframes flash { to { transform: translate(-50%,-50%) scale(var(--s, 8)); opacity: 0; } }
.spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ffe3a3; animation: spark 650ms ease-out forwards; pointer-events: none; }
@keyframes spark { to { transform: translate(var(--x), var(--y)) scale(.2); opacity: 0; } }
.dust { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #8a8178; transform: translate(-50%,-50%); animation: dust 600ms ease-out forwards; }
@keyframes dust { to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(2.2); opacity: 0; } }

/* ---------- overlays ---------- */
.title { position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 9vh); text-align: center; padding-inline: 16px; transition: opacity 500ms ease, transform 500ms ease; }
.title.gone { opacity: 0; transform: translateY(-30px); pointer-events: none; }
.title h1 { margin: 0; font-family: var(--f-display); font-size: clamp(54px, 13vw, 120px); line-height: 0.9; letter-spacing: 0.02em; color: var(--lantern); text-shadow: 0 4px 0 #8a4f0e, 0 0 40px rgba(255,181,71,.35); }
.title .sub { margin-top: 14px; font-family: var(--f-mono); font-size: clamp(12px, 2.6vw, 16px); letter-spacing: 0.5em; text-transform: uppercase; color: var(--fg); padding-left: .5em; }
.title .rules { margin-top: 12px; font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

.hud { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 14px) 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, rgba(10,7,5,.75), transparent); transition: opacity 400ms ease; }
.hud.gone { opacity: 0; pointer-events: none; }
.brand { font-family: var(--f-display); font-size: 20px; color: var(--lantern); }
.sockets { display: flex; gap: 6px; }
.socket { width: 30px; height: 30px; border-radius: 8px; background: rgba(0,0,0,.45); box-shadow: inset 0 2px 5px rgba(0,0,0,.6); display: grid; place-items: center; }
.socket.now { outline: 2px dashed var(--lantern); outline-offset: 1px; }
.socket .gem { width: 62%; }
.depth { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.depth b { display: block; font-size: 20px; color: var(--fg); }
.depth small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

.panel { position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
  width: min(560px, calc(100% - 32px)); max-height: 58dvh; overflow: auto; box-sizing: border-box;
  background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: flex; flex-direction: column; gap: 14px; transition: opacity 300ms ease; }
.panel.hide { opacity: 0; pointer-events: none; }
.lede { margin: 0; color: var(--muted); line-height: 1.5; }
.lede b { color: var(--fg); }
.legend { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; text-align: center; }
.legend div { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.legend .gem { width: 26px; }
.legend span { font-size: 11px; line-height: 1.15; }
.legend small { display: block; font-family: var(--f-mono); color: var(--muted); font-size: 10px; }
.foot { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }

button {
  font: inherit; cursor: pointer; border: 0; border-radius: 999px; padding: 14px 22px;
  font-weight: 800; font-size: 17px; background: var(--lantern); color: #2a1a08;
  box-shadow: 0 4px 0 #a86a12; transition: transform 80ms ease, box-shadow 80ms ease;
}
button:active { transform: translateY(3px); box-shadow: 0 1px 0 #a86a12; }
button:focus-visible, input:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
button.ghost { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--line); }
button.big { font-family: var(--f-display); font-weight: 400; font-size: 22px; letter-spacing: .06em; padding: 16px 22px; }

.roundtag { font-family: var(--f-mono); font-size: 12px; color: var(--lantern); letter-spacing: 0.1em; text-transform: uppercase; }
.prompt { font-family: var(--f-display); font-size: clamp(28px, 7vw, 40px); line-height: 1; margin: 0; text-wrap: balance; }
.timer { height: 8px; border-radius: 99px; background: rgba(0,0,0,0.45); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--lantern); transform-origin: left; }
.timer.low i { background: var(--bad); }
.secs { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
form { display: flex; gap: 10px; flex-wrap: wrap; }
input { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 18px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(0,0,0,0.4); color: var(--fg); }
.hint { margin: 0; font-size: 13px; color: var(--bad); min-height: 1.2em; }

.reveal { text-align: center; align-items: center; }
.reveal-head { display: flex; align-items: center; gap: 14px; }
.reveal-head .gem { width: 44px; }
.tiername { font-family: var(--f-display); font-size: 32px; margin: 0; line-height: 1; }
.pts { font-family: var(--f-mono); color: var(--lantern); font-size: 16px; text-align: left; }
.youSaid { margin: 0; color: var(--muted); }
.youSaid b { color: var(--fg); }
.facts { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.facts div { background: rgba(0,0,0,0.3); border-radius: 12px; padding: 12px; min-width: 0; }
.facts small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.facts b { overflow-wrap: anywhere; }
.reveal button { width: 100%; }

.total { font-family: var(--f-display); font-size: clamp(56px, 16vw, 84px); line-height: 0.9; margin: 0; color: var(--lantern); font-variant-numeric: tabular-nums; }
.total small { font-size: 0.32em; color: var(--muted); }
.recap { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.recap li { display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.recap li:last-child { border-bottom: 0; }
.recap .gem { width: 24px; }
.recap .q { font-size: 12px; color: var(--muted); }
.recap .a { font-weight: 600; overflow-wrap: anywhere; }
.recap .p { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--lantern); }
pre.share { margin: 0; font-family: var(--f-mono); background: rgba(0,0,0,0.35); border-radius: 12px; padding: 12px; white-space: pre-wrap; font-size: 15px; user-select: all; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row button { flex: 1 1 140px; }
.toast { font-size: 13px; color: var(--muted); min-height: 1.2em; margin: 0; }

@media (max-height: 640px) { .title { top: 4vh; } .title .rules { display: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; -webkit-font-smoothing: antialiased; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
</head>

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
  .replace(/&/g, " and ").replace(/[^a-z0-9 ]/g, " ").replace(/\b(the|a|an)\b/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur; }
  return prev[n];
}
function parse(p) {
  return p.list.trim().split("\n").map(line => {
    const [name, tier, ...aliases] = line.split("|");
    return { name, tier: +tier, keys: [name, ...aliases].map(norm) };
  });
}
PROMPTS.forEach(p => { p.answers = parse(p); p.rarest = p.answers.filter(a => a.tier === 5).map(a => a.name); });
function match(prompt, guess) {
  const g = norm(guess); if (!g) return null;
  for (const a of prompt.answers) if (a.keys.includes(g)) return a;
  let best = null, bestD = Infinity;
  for (const a of prompt.answers) for (const k of a.keys) {
    const tol = k.length >= 9 ? 2 : k.length >= 5 ? 1 : 0;
    const d = lev(g, k); if (d <= tol && d < bestD) { best = a; bestD = d; }
  }
  return best;
}

const LAYER_DECOR = [["root", "worm", "root"], ["bone", "skull", "bone"], ["bone", "vein"], ["ammonite", "ammonite"], ["vein", "vein"], ["lava", "lava"]];

function buildWorld() {
  let r = 11;
  const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  const sky = $("sky");
  for (let i = 0; i < 90; i++) {
    const s = document.createElement("i"); s.className = "star" + (i % 4 ? "" : " tw");
    const size = 1 + rnd() * 2;
    Object.assign(s.style, { left: rnd() * 100 + "%", top: rnd() * 92 + "%", width: size + "px", height: size + "px", opacity: 0.4 + rnd() * 0.6, animationDelay: rnd() * 2.6 + "s" });
    sky.appendChild(s);

    Object.assign(d.style, { top: b.from * PX + "px", height: (b.to - b.from) * PX + "px", backgroundColor: b.c,
      backgroundImage: `radial-gradient(${b.tex} 18%, transparent 20%), radial-gradient(rgba(0,0,0,.18) 14%, transparent 16%)`,
      backgroundSize: "38px 31px, 57px 47px", backgroundPosition: "0 0, 19px 13px", boxShadow: "inset 0 2px 0 rgba(0,0,0,.25)" });
    under.appendChild(d);
    // scatter this layer's gem plus a few things you'd find at this depth, keeping the shaft clear
    const count = 26;
    for (let k = 0; k < count; k++) {
      let side; do { side = rnd() * 1300 - 650; } while (SHAFT_X.some(sx => Math.abs(sx - side) < 50));  // px from centre, clear of every hole
      const y = (b.from + 10 + rnd() * (b.to - b.from - 18)) * PX;
      const e = document.createElement("div");
      const isGem = k % 3 !== 2;
      if (isGem) {
        e.className = `deco gem t${i}`;
        e.style.width = (16 + rnd() * 14 + i * 2) + "px";
      } else {
        const kinds = LAYER_DECOR[i]; e.className = "deco";
        e.innerHTML = DECOR[kinds[Math.floor(rnd() * kinds.length)]];
        e.style.width = (34 + rnd() * 24) + "px";
      }
      Object.assign(e.style, { left: `calc(50% + ${side}px)`, top: y + "px", transform: `translate(-50%,-50%) rotate(${(rnd() * 70 - 35).toFixed(0)}deg)` });
      under.appendChild(e);
    }
  });
  const dark = document.createElement("div"); dark.className = "darkness"; dark.style.height = MAX_M * PX + "px"; under.appendChild(dark);
  const ruler = $("ruler");
  for (let m = 0; m <= MAX_M; m += 20) {
    const t = document.createElement("div"); t.className = "tick" + (m % 100 ? "" : " big"); t.style.top = m * PX + "px";
    if (m % 100 === 0) t.innerHTML = `<span>${m} m</span>`;
    ruler.appendChild(t);

}
const stratumAt = m => (STRATA.find(b => m < b.to) || STRATA[STRATA.length - 1]).name;

function sizeMiner() {
  S = innerWidth < 600 ? 1.6 : 2;
  miner.setAttribute("viewBox", "-35 -62 105 72");
  miner.setAttribute("width", 105 * S); miner.setAttribute("height", 72 * S);
}
// each prompt gets its own fresh hole, five steps along from the last one
const SHAFT_X = [-260, -130, 0, 130, 260];
let minerX = SHAFT_X[0], curShaft = null, shaftY = 0;
function newShaft(x) {
  curShaft = document.createElement("div");
  curShaft.className = "shaft";
  curShaft.style.left = `calc(50% + ${x}px)`;
  $("shafts").appendChild(curShaft); shaftY = 0;
}
function setMiner(x, y) {
  minerX = x; curY = y;
  miner.style.transform = `translate(${x - 35 * S}px, ${y - 62 * S}px)`;
  if (curShaft && y > shaftY) { shaftY = y; curShaft.style.height = y + 4 + "px"; }
  glow.style.transform = `translate(${x}px, ${y - 40 * S - 150}px)`;
  glow.style.opacity = y > 4 ? 1 : 0;
}
const setPick = a => pick.setAttribute("transform", `rotate(${a})`);
function place(x, y, anchor) {
  const ty = Math.round(innerHeight * anchor - y);
  world.style.transform = `translate(${-x}px, ${ty}px)`;
  $("rulerWrap").style.transform = `translateY(${ty}px)`;
}
function camTo(y, anchor, animate) {
  cam = { y, anchor };
  const t = animate && !reduceMotion ? "transform 900ms cubic-bezier(.45,0,.2,1)" : "none";
  world.style.transition = t; $("rulerWrap").style.transition = t;
  place(minerX, y, anchor);
}
function follow(x, y) {
  world.style.transition = "none"; $("rulerWrap").style.transition = "none";
  cam.y = y; place(x, y, cam.anchor);
}
function setHUD(m) {
  $("scoreNum").textContent = score + " pts";
  $("stratum").textContent = (m < 1 ? "Surface" : stratumAt(m)) + " · " + Math.round(m) + " m";
}

const tween = (ms, fn) => new Promise(res => {
  if (ms <= 0 || reduceMotion) { fn(1); return res(); }
  const s = performance.now();
  const f = t => { const k = Math.min(1, (t - s) / ms); fn(k); k < 1 ? requestAnimationFrame(f) : res(); };
  requestAnimationFrame(f);

const ease = k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const easeIn = k => k * k * k;

let idleRAF = null;
function idle(on) {
  cancelAnimationFrame(idleRAF);
  if (!on || reduceMotion) return;
  const loop = t => { setPick(-55 + Math.sin(t / 500) * 7); idleRAF = requestAnimationFrame(loop); };
  idleRAF = requestAnimationFrame(loop);
}

function burst(x, y, tier) {
  const add = (cls, style) => { const e = document.createElement("div"); e.className = cls; Object.assign(e.style, style); finds.appendChild(e); setTimeout(() => e.remove(), 900); };
  add("flash", { left: x, top: y + "px", "--s": 6 + tier * 2 });
  if (tier >= 2) for (let i = 0; i < 6 + tier * 2; i++) {
    const a = (i / (6 + tier * 2)) * Math.PI * 2, d = 40 + tier * 14;
    add("spark", { left: x, top: y + "px", "--x": Math.cos(a) * d + "px", "--y": Math.sin(a) * d + "px" });
  }
}
function dust(x, y) {
  for (let i = 0; i < 5; i++) {
    const e = document.createElement("div"); e.className = "dust";
    Object.assign(e.style, { left: x, top: y + "px", "--x": (Math.random() * 40 - 10) + "px", "--y": (-Math.random() * 30) + "px" });
    finds.appendChild(e); setTimeout(() => e.remove(), 800);
  }
}

// from the surface, dig a fresh hole down to the layer of `tier` and strike its gem (null = came up empty)
async function dig(tier) {
  idle(false); cam.anchor = 0.3;
  const x = minerX, to = tier == null ? 0 : tierDepth(tier) * PX;
  newShaft(x);
  await tween(240, k => setPick(-55 - 25 * k));
  if (to > 0) {
    const swings = 3 + tier * 2, dur = 1000 + tier * 380;
    await tween(dur, k => {
      const y = to * ease(k);
      setMiner(x, y); setHUD(y / PX); follow(x, y);
      const ph = (k * swings) % 1;
      setPick(ph < 0.5 ? -80 + 130 * (ph / 0.5) : 50 - 130 * ((ph - 0.5) / 0.5));
    });
  }
  await tween(200, k => setPick(50 - 130 * k));
  await tween(110, k => setPick(-80 + 130 * k * k));
  const gx = `calc(50% + ${x + 30 * S}px)`, gy = to - 8 * S;
  if (tier == null) { dust(gx, gy); await tween(450, () => {}); }
  else {
    burst(gx, gy, tier);
    const g = document.createElement("div");
    g.className = `gem t${tier} struck`;
    Object.assign(g.style, { left: gx, top: gy + "px", width: (26 + tier * 3) * S / 1.6 + "px" });
    finds.appendChild(g);
    await tween(520, () => {});
  }
  setPick(-20);
}

// clip onto the line and zip up out of the hole
async function zipUp() {
  const from = curY, x = minerX;
  idle(false);
  if (from > 0) {
    rope.style.left = `calc(50% + ${x + 4}px)`;
    rope.style.height = (from - 52 * S + 150) + "px";
    rope.hidden = false; setPick(-100);
    await tween(250, () => {});                                   // clip on
    await tween(380 + from * 0.22, k => {                         // zip!
      const y = from * (1 - easeIn(k));
      setMiner(x, y); setHUD(y / PX); follow(x, y);
      rope.style.height = Math.max(0, y - 52 * S + 150) + "px";
    });
    await tween(140, k => setMiner(x, -10 * Math.sin(k * Math.PI)));  // pop out onto the grass
    rope.hidden = true;
  }
  setPick(-35);
}

// five steps along to fresh ground
async function walkTo(toX) {
  const from = minerX;
  await tween(1150, k => {
    const x = from + (toX - from) * k;
    setMiner(x, -Math.abs(Math.sin(k * 5 * Math.PI)) * 5);
    follow(x, 0);
  });
  setMiner(toX, 0); setPick(-55);
}

let round = 0, results = [], tick = null;

function drawSockets() {

function showPanel(html, cls = "") { panel.className = "panel " + cls; panel.innerHTML = html; }

function startScreen() {

function roundScreen() {
  const p = PROMPTS[round];
  drawSockets(); idle(true);
  showPanel(`
    <div class="roundtag">Prompt ${round + 1} of ${ROUNDS}</div>
    <h2 class="prompt">${p.q}</h2>
    <div class="timer" id="timer"><i id="bar"></i></div>
    <form id="f" autocomplete="off">
      <input id="ans" placeholder="Type an answer…" aria-label="Your answer" autocomplete="off" autocapitalize="off" spellcheck="false">

  tick = setInterval(() => {

async function finishRound(hit) {
  const p = PROMPTS[round];
  const r = hit ? { q: p.q, said: hit.name, tier: hit.tier, pts: TIERS[hit.tier].pts } : { q: p.q, said: null, tier: null, pts: 0 };
  results.push(r);

  panel.classList.add("hide");
  await dig(r.tier);
  score += r.pts; setHUD(curY / PX); drawSockets();

function revealScreen(r, p) {

function resultsScreen() {

    <p class="total">${score}<small> / 500</small></p>
    <ul class="recap">${results.map(r => `
      <li>${gemHTML(r.tier)}<div><div class="q">${r.q}</div><div class="a">${r.said || "Nothing found"}</div></div><span class="p">${r.pts}</span></li>`).join("")}
    </ul>
    <pre class="share" id="share">${share}</pre>
    <div class="row"><button id="copy">Copy result</button><button class="ghost" id="again">Play again</button></div>
    <p class="toast" id="toast"></p>`);
  $("copy").onclick = () => {
    const t = $("toast");
    navigator.clipboard.writeText(share).then(() => t.textContent = "Copied. Go flex it.").catch(() => {
      const sel = getSelection(), rng = document.createRange(); rng.selectNodeContents($("share"));
      sel.removeAllRanges(); sel.addRange(rng); t.textContent = "Selected. Copy it with your keyboard.";
    });
  };
  $("again").onclick = startScreen;
}

addEventListener("resize", () => { sizeMiner(); setMiner(minerX, curY); camTo(cam.y, cam.anchor, false); });
buildWorld(); sizeMiner(); startScreen();
</script>

</body>
